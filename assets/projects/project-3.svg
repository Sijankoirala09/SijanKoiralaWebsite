<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="p3-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#5e5ce6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p3-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e5ce6"/>
      <stop offset="50%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p3-bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#p3-radial)"/>

  <!-- Waveform curves -->
  <path d="M 100 320 C 220 180, 280 420, 400 300 C 520 180, 580 420, 700 300" fill="none" stroke="url(#p3-wave)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 330 C 230 220, 290 400, 400 310 C 510 220, 570 390, 680 310" fill="none" stroke="url(#p3-wave)" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 140 340 C 240 260, 300 380, 400 320 C 500 260, 560 370, 660 320" fill="none" stroke="url(#p3-wave)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Apple glass circle -->
  <circle cx="400" cy="300" r="75" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="400" cy="300" r="50" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <polygon points="392,285 416,300 392,315" fill="#ffffff"/>

  <!-- Project titles -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="3" text-anchor="middle">AURA AUDIO LABS</text>
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" letter-spacing="2" text-anchor="middle">SOUND IDENTITY & KEY VISUALS</text>
  
  <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">DIGITAL MEDIA / IDENTITY</text>
  <text x="720" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="end">CASE STUDY 03</text>
</svg>
