<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1411"/>
      <stop offset="100%" stop-color="#070a08"/>
    </linearGradient>
    <linearGradient id="p4-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd6b0"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#8b7355"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p4-bg)"/>

  <!-- Botanical bottle silhouette -->
  <g transform="translate(400, 260)">
    <!-- Dropper top -->
    <rect x="-8" y="-130" width="16" height="35" rx="5" fill="#1f2620" stroke="#374338" stroke-width="1.5"/>
    <rect x="-14" y="-95" width="28" height="15" rx="3" fill="#2d382e"/>
    <!-- Bottle neck -->
    <rect x="-18" y="-80" width="36" height="25" fill="#1c241d"/>
    <!-- Bottle body -->
    <rect x="-60" y="-55" width="120" height="175" rx="18" fill="#151b16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Minimal label on bottle -->
    <rect x="-45" y="-20" width="90" height="110" rx="4" fill="#0b0e0c" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1"/>
    <text x="0" y="15" font-family="-apple-system, Georgia, serif" font-size="14" font-weight="600" fill="url(#p4-gold)" text-anchor="middle" letter-spacing="3">KĀVYA</text>
    <line x1="-20" y1="28" x2="20" y2="28" stroke="url(#p4-gold)" stroke-width="0.75"/>
    <text x="0" y="45" font-family="-apple-system, sans-serif" font-size="7" fill="#8f9e91" text-anchor="middle" letter-spacing="1.5">ORGANIC BOTANICALS</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="6" fill="#5f6e61" text-anchor="middle">50 ML / 1.7 FL OZ</text>
  </g>

  <!-- Title & details -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="3" text-anchor="middle">KĀVYA BOTANICALS</text>
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" letter-spacing="2" text-anchor="middle">LUXURY PACKAGING & ART DIRECTION</text>

  <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">PACKAGING DESIGN</text>
  <text x="720" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="end">KATHMANDU / 2026</text>
</svg>
