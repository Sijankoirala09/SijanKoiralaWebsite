<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="p6-slab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p6-bg)"/>

  <!-- Brutalist Monolith Slabs -->
  <g transform="translate(400, 240)">
    <rect x="-140" y="-80" width="60" height="180" rx="4" fill="url(#p6-slab)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="-60" y="-120" width="60" height="220" rx="4" fill="#222226" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <rect x="20" y="-60" width="60" height="160" rx="4" fill="url(#p6-slab)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="100" y="-100" width="40" height="200" rx="4" fill="#18181a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Typography -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4" text-anchor="middle">MONOLITH ARCHIVE</text>
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" letter-spacing="2" text-anchor="middle">MINIMAL VISUAL IDENTITY & CATALOGUE</text>

  <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">BRANDING & EDITORIAL</text>
  <text x="720" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="end">PROJECT / 06</text>
</svg>
