<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="p5-cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#147ce5"/>
    </linearGradient>
    <linearGradient id="p5-cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0040dd"/>
      <stop offset="100%" stop-color="#002b94"/>
    </linearGradient>
    <linearGradient id="p5-cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#2997ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p5-bg)"/>

  <!-- Isometric floating 3D shapes -->
  <g transform="translate(400, 250)">
    <!-- Ambient glow behind cube -->
    <circle cx="0" cy="0" r="140" fill="#2997ff" fill-opacity="0.12" filter="blur(30px)"/>

    <!-- Main 3D Cube -->
    <!-- Top Face -->
    <polygon points="0,-70 80,-25 0,20 -80,-25" fill="url(#p5-cube-top)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Left Face -->
    <polygon points="-80,-25 0,20 0,110 -80,65" fill="url(#p5-cube-left)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Right Face -->
    <polygon points="0,20 80,-25 80,65 0,110" fill="url(#p5-cube-right)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Orbital ring -->
    <ellipse cx="0" cy="20" rx="130" ry="45" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- Typography -->
  <text x="400" y="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="3" text-anchor="middle">NEXUS 3D ART DIRECTION</text>
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" letter-spacing="2" text-anchor="middle">DIMENSIONAL DESIGN & KEY VISUALS</text>

  <text x="80" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">3D & MOTION</text>
  <text x="720" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="end">EXPERIMENT / 05</text>
</svg>
