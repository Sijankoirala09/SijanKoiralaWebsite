<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="av-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8e8e93"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#av-bg)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Elegant geometric monogram badge -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="100" y="116" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="700" fill="url(#av-glow)" text-anchor="middle" letter-spacing="-2">SK</text>
</svg>
